version: 2.1

############################################################################

references:
   checkout_job_steps: &checkout_job_steps
      steps:
         - checkout:
             method: full
         - run:
            name: Checking out dependencies.
            command: |
               git clone -b develop --single-branch https://github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
               git clone -b ZCS-18921 --single-branch https://github.com/Zimbra/zm-zcs.git ~/zm-zcs
               git clone -b master --single-branch https://github.com/Zimbra/zimbra-package-stub.git ~/zimbra-package-stub
               git clone -b develop --single-branch https://github.com/Zimbra/zm-mailbox.git ~/zm-mailbox
               git clone -b develop --single-branch https://github.com/Zimbra/zm-ajax.git ~/zm-ajax
               git clone -b develop --single-branch https://github.com/Zimbra/zm-taglib.git ~/zm-taglib
               echo "BUILD_NO=$CIRCLE_BUILD_NUM" > config.build
               mkdir -p ~/.zcs-deps
         - persist_to_workspace:
            root: ..
            paths:
               - zm-web-client
               - zm-pkg-tool
               - zm-zcs
               - zimbra-package-stub
               - zm-mailbox
               - zm-ajax
               - zm-taglib
               - .zcs-deps

   build_job_steps: &build_job_steps
      steps:
         - attach_workspace:
            at: ..
         - run:
            name: Creating package build
            command: |
              mkdir -p /home/build/.ivy2/cache
              sudo apt-get update
              sudo apt-get install -y ant-contrib rpm dpkg-dev fakeroot lsb-release debhelper build-essential
              cp /usr/share/java/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar || true
              cd ../zm-ajax
              JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
              export JAVA_HOME
              export PATH="$JAVA_HOME/bin:$PATH"
              ant -Dzimbra.buildinfo.version=10.1.0_GA_1001 clean publish-local
              # build.xml uses ivy:install revision="latest.integration"; publish-local uses dev.version.
              # Mirror published jars so filesystem resolver satisfies hardcoded latest.integration.
              AJAX_PUB="$(find ~/.zcs-deps/zimbra/zm-ajax -maxdepth 1 -type f -name 'zm-ajax-*.jar' ! -name 'zm-ajax-latest.integration.jar' -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
              if [ -n "$AJAX_PUB" ] && [ -f "$AJAX_PUB" ]; then
                mkdir -p ~/.zcs-deps/zimbra/zm-ajax
                cp -f "$AJAX_PUB" ~/.zcs-deps/zimbra/zm-ajax/zm-ajax-latest.integration.jar
                cp -f "$AJAX_PUB" ~/.zcs-deps/zimbra/zm-ajax/zm-ajax-local.jar
              fi
              cd ../zm-taglib
              ant -Dzimbra.buildinfo.version=10.1.0_GA_1001 clean publish-local
              echo "Listing taglib publish outputs before aliasing"
              ls -la ~/.zcs-deps/zimbra/zm-taglib 2>/dev/null || true
              ls -la build 2>/dev/null || true
              TAGLIB_PUB="$(find ~/.zcs-deps/zimbra/zm-taglib -maxdepth 1 -type f -name '*.jar' ! -name 'zm-taglib-latest.integration.jar' ! -name 'zm-taglib-local.jar' -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
              if [ -z "$TAGLIB_PUB" ] || [ ! -f "$TAGLIB_PUB" ]; then
                TAGLIB_PUB="$(find build -maxdepth 1 -type f -name '*.jar' -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
              fi
              if [ -n "$TAGLIB_PUB" ] && [ -f "$TAGLIB_PUB" ]; then
                mkdir -p ~/.zcs-deps/zimbra/zm-taglib
                cp -f "$TAGLIB_PUB" ~/.zcs-deps/zimbra/zm-taglib/zm-taglib-latest.integration.jar
                cp -f "$TAGLIB_PUB" ~/.zcs-deps/zimbra/zm-taglib/zm-taglib-local.jar
                echo "Aliased taglib jar: $TAGLIB_PUB"
                ls -la ~/.zcs-deps/zimbra/zm-taglib
              else
                echo "ERROR: could not locate any zm-taglib jar after publish-local"
                ls -la ~/.zcs-deps/zimbra/zm-taglib 2>/dev/null || true
                ls -la build 2>/dev/null || true
                exit 1
              fi
              cd ../zm-mailbox
              JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
              export JAVA_HOME
              export PATH="$JAVA_HOME/bin:$PATH"
              ant -Dzimbra.buildinfo.version=10.1.0_GA_1001 clean publish-local-all
              cd ../zm-web-client
              chmod +x pkg-builder.pl
              JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
              export JAVA_HOME
              export PATH="$JAVA_HOME/bin:$PATH"
              # ivy:resolve reads ivy.xml/ivy-jspc.xml and fails on dynamic latest.integration for local-only modules.
              perl -0777 -i -pe 's#(<dependency org="zimbra" name="zm-ajax" rev=")latest\.integration("\s*/>)#${1}local${2}#g; s#(<dependency org="zimbra" name="zm-taglib" rev=")latest\.integration("\s*/>)#${1}local${2}#g' ivy.xml ivy-jspc.xml
              echo "Resolved local ivy deps:"
              perl -ne 'print if /name="zm-ajax"|name="zm-taglib"/' ivy.xml ivy-jspc.xml
              ant -Dzimbra.buildinfo.version=10.1.0_GA_1001 clean pkg
         - persist_to_workspace:
            root: ..
            paths:
               - .ivy2
               - .zcs-deps
               - zm-web-client/build/dist

   publish_job_steps: &publish_job_steps
      steps:
         - attach_workspace:
            at: ..
         - run:
            name: Publish package artifacts to Nexus
            command: |
              mkdir -p /home/build/.ivy2/cache
              sudo apt-get update
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl ant-contrib rpm dpkg-dev fakeroot lsb-release debhelper build-essential
              cp /usr/share/java/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar || true
              cd ../zm-ajax
              JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
              export JAVA_HOME
              export PATH="$JAVA_HOME/bin:$PATH"
              ant -Dzimbra.buildinfo.version=10.1.0_GA_1001 clean publish-local
              AJAX_PUB="$(find ~/.zcs-deps/zimbra/zm-ajax -maxdepth 1 -type f -name 'zm-ajax-*.jar' ! -name 'zm-ajax-latest.integration.jar' -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
              if [ -n "$AJAX_PUB" ] && [ -f "$AJAX_PUB" ]; then
                mkdir -p ~/.zcs-deps/zimbra/zm-ajax
                cp -f "$AJAX_PUB" ~/.zcs-deps/zimbra/zm-ajax/zm-ajax-latest.integration.jar
                cp -f "$AJAX_PUB" ~/.zcs-deps/zimbra/zm-ajax/zm-ajax-local.jar
              fi
              cd ../zm-taglib
              ant -Dzimbra.buildinfo.version=10.1.0_GA_1001 clean publish-local
              echo "Listing taglib publish outputs before aliasing"
              ls -la ~/.zcs-deps/zimbra/zm-taglib 2>/dev/null || true
              ls -la build 2>/dev/null || true
              TAGLIB_PUB="$(find ~/.zcs-deps/zimbra/zm-taglib -maxdepth 1 -type f -name '*.jar' ! -name 'zm-taglib-latest.integration.jar' ! -name 'zm-taglib-local.jar' -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
              if [ -z "$TAGLIB_PUB" ] || [ ! -f "$TAGLIB_PUB" ]; then
                TAGLIB_PUB="$(find build -maxdepth 1 -type f -name '*.jar' -printf '%T@\t%p\n' 2>/dev/null | sort -t "$(printf '\t')" -k1,1rn | head -1 | cut -f2-)"
              fi
              if [ -n "$TAGLIB_PUB" ] && [ -f "$TAGLIB_PUB" ]; then
                mkdir -p ~/.zcs-deps/zimbra/zm-taglib
                cp -f "$TAGLIB_PUB" ~/.zcs-deps/zimbra/zm-taglib/zm-taglib-latest.integration.jar
                cp -f "$TAGLIB_PUB" ~/.zcs-deps/zimbra/zm-taglib/zm-taglib-local.jar
                echo "Aliased taglib jar: $TAGLIB_PUB"
                ls -la ~/.zcs-deps/zimbra/zm-taglib
              else
                echo "ERROR: could not locate any zm-taglib jar after publish-local"
                ls -la ~/.zcs-deps/zimbra/zm-taglib 2>/dev/null || true
                ls -la build 2>/dev/null || true
                exit 1
              fi
              cd ../zm-mailbox
              JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
              export JAVA_HOME
              export PATH="$JAVA_HOME/bin:$PATH"
              ant -Dzimbra.buildinfo.version=10.1.0_GA_1001 clean publish-local-all
              cd ../zm-web-client
              : "${NEXUS_BASE_URL:?NEXUS_BASE_URL is required}"
              : "${NEXUS_USER:?NEXUS_USER is required}"
              : "${NEXUS_PASSWORD:?NEXUS_PASSWORD is required}"
              ROOT="build/dist"
              APT_REPO="package-repo-apt"
              YUM_REPO="package-repo-yum"
              MODULE_PATH="zimbra/zm-web-client/${CIRCLE_SHA1:-develop}"
              RAW_BASE="$(printf '%s' "$NEXUS_BASE_URL" | sed 's/#.*$//' | sed 's:/*$::')"
              API_BASE="$RAW_BASE/service/rest/v1/components"
              PACKAGE_FILES="$(find "$ROOT" -type f \( -name '*.deb' -o -name '*.rpm' \))"
              if [ -z "$PACKAGE_FILES" ]; then
                echo "No package artifacts found in $ROOT"
                exit 1
              fi
              package_list_file="$(mktemp)"
              printf '%s\n' "$PACKAGE_FILES" > "$package_list_file"
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                rel="$(echo "$f" | sed "s|^$ROOT/||")"
                dir="$(dirname "$rel")"
                file_name="$(basename "$f")"
                body_file="$(mktemp)"
                header_file="$(mktemp)"
                case "$f" in
                  *.deb)
                    repo="$APT_REPO"
                    url="$API_BASE?repository=$repo"
                    http_code="$(curl --silent --show-error --user "$NEXUS_USER:$NEXUS_PASSWORD" --request POST "$url" -F "apt.asset=@$f" --dump-header "$header_file" --output "$body_file" --write-out '%{http_code}' || true)"
                    ;;
                  *.rpm)
                    repo="$YUM_REPO"
                    yum_dir="$MODULE_PATH/$dir"
                    url="$API_BASE?repository=$repo"
                    http_code="$(curl --silent --show-error --user "$NEXUS_USER:$NEXUS_PASSWORD" --request POST "$url" -F "yum.directory=$yum_dir" -F "yum.asset=@$f" -F "yum.asset.filename=$file_name" --dump-header "$header_file" --output "$body_file" --write-out '%{http_code}' || true)"
                    ;;
                  *)
                    rm -f "$body_file" "$header_file"
                    continue
                    ;;
                esac
                case "$http_code" in
                  2??)
                    echo "Upload successful: $file_name (HTTP $http_code)"
                    ;;
                  *)
                    echo "Upload failed for $f (HTTP $http_code)"
                    [ -s "$header_file" ] && sed -n '1,80p' "$header_file"
                    [ -s "$body_file" ] && sed -n '1,120p' "$body_file"
                    rm -f "$body_file" "$header_file"
                    exit 1
                    ;;
                esac
                rm -f "$body_file" "$header_file"
              done < "$package_list_file"
              rm -f "$package_list_file"

############################################################################

jobs:
   checkout:
      working_directory: ~/zm-web-client
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: small
      <<: *checkout_job_steps

   build:
      working_directory: ~/zm-web-client
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: medium
      <<: *build_job_steps

   publish:
      working_directory: ~/zm-web-client
      shell: /bin/bash -eo pipefail
      circleci_ip_ranges: true
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: small
      <<: *publish_job_steps

############################################################################

workflows:
   version: 2
   main:
      jobs:
         - checkout:
            context:
               - docker-dev-registry
            filters:
               branches:
                  only:
                    - develop
                    - publish-nexus-package-poc
         - build:
            context:
               - docker-dev-registry
            requires:
               - checkout
         - publish:
            context:
               - docker-dev-registry
            requires:
               - build
            filters:
               branches:
                 only:
                   - develop
                   - publish-nexus-package-poc
