version: 2.1

############################################################################

references:
   checkout_job_steps: &checkout_job_steps
      steps:
         - checkout:
             method: full
         - run:
            name: Checking out dependencies.
            command: |
               git clone -b develop --single-branch https://github.com/Zimbra/zm-pkg-tool.git ~/zm-pkg-tool
               git clone -b ZCS-18921 --single-branch https://github.com/Zimbra/zm-zcs.git ~/zm-zcs
               git clone -b master --single-branch https://github.com/Zimbra/zimbra-package-stub.git ~/zimbra-package-stub
               git clone -b develop --single-branch https://github.com/Zimbra/zm-mailbox.git ~/zm-mailbox
               git clone -b develop --single-branch https://github.com/Zimbra/zm-timezones.git ~/zm-timezones
               git clone -b develop --single-branch https://github.com/Zimbra/zm-ajax.git ~/zm-ajax
               git clone -b develop --single-branch https://github.com/Zimbra/zm-taglib.git ~/zm-taglib
               mkdir -p ~/.zcs-deps
         - persist_to_workspace:
            root: ..
            paths:
               - zm-web-client
               - zm-pkg-tool
               - zm-zcs
               - zimbra-package-stub
               - zm-mailbox
               - zm-timezones
               - zm-ajax
               - zm-taglib
               - .zcs-deps

   build_job_steps_ubuntu: &build_job_steps_ubuntu
      steps:
         - attach_workspace:
            at: ..
         - run:
            name: Creating package build
            command: |
              mkdir -p /home/build/.ivy2/cache
              sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ant-contrib
              cp /usr/share/java/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar || true
              export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
              export PATH="$JAVA_HOME/bin:$PATH"
              BUILD_RELEASE_NUMBER="${BUILD_RELEASE_NO%_}"
              BUILD_RELEASE_NUMBER="${BUILD_RELEASE_NUMBER%_GA}"
              export PKG_RELEASE="1~develop-snapshot"
              BUILDINFO_REVISION="1~develop-snapshot"
              cd ../zm-mailbox
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NUMBER}_${CIRCLE_BUILD_NUM}" clean publish-local-all
              cd ../zm-timezones
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NUMBER}_${CIRCLE_BUILD_NUM}" -Dzimbra.buildinfo.revision="${BUILDINFO_REVISION}" clean pkg
              cd ../zm-taglib
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NUMBER}_${CIRCLE_BUILD_NUM}" clean publish-local
              cd ../zm-ajax
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NUMBER}_${CIRCLE_BUILD_NUM}" clean publish-local
              cd ../zm-web-client
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NUMBER}_${CIRCLE_BUILD_NUM}" -Dzimbra.buildinfo.revision="${BUILDINFO_REVISION}" -Dwclient.ext.patch.version="${BUILD_RELEASE_NUMBER}" -Dwclient.ext.patch.revision="${PKG_RELEASE}" clean pkg
              JOB_OUT_DIR="build/dist/${CIRCLE_JOB}"
              mkdir -p "$JOB_OUT_DIR"
              find build/dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) -exec mv -f {} "$JOB_OUT_DIR"/ \;
              rm -rf build/dist/jetty
         - store_artifacts:
            path: build/dist
         - persist_to_workspace:
            root: ..
            paths: zm-web-client/build/dist/*

   build_job_steps_centos: &build_job_steps_centos
      steps:
         - attach_workspace:
            at: ..
         - run:
            name: Creating package build
            command: |
              mkdir -p /home/build/.ivy2/cache
              if command -v yum >/dev/null 2>&1; then
                command -v ant >/dev/null 2>&1 || sudo yum install -y ant
              elif command -v dnf >/dev/null 2>&1; then
                command -v ant >/dev/null 2>&1 || sudo dnf install -y ant
              else
                exit 1
              fi
              if [ -f /usr/share/java/ant-contrib.jar ]; then
                cp /usr/share/java/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar
              elif [ -f /usr/share/ant/lib/ant-contrib.jar ]; then
                cp /usr/share/ant/lib/ant-contrib.jar ~/.zcs-deps/ant-contrib-1.0b1.jar
              else
                curl --fail --location --silent --show-error \
                  "https://files.zimbra.com/repository/ant-contrib/ant-contrib-1.0b1.jar" \
                  --output ~/.zcs-deps/ant-contrib-1.0b1.jar
              fi
              DETECTED_JAVAC="$(command -v javac)"
              export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$DETECTED_JAVAC")")")"
              export PATH="$JAVA_HOME/bin:$PATH"
              BUILD_RELEASE_NUMBER="${BUILD_RELEASE_NO%_}"
              BUILD_RELEASE_NUMBER="${BUILD_RELEASE_NUMBER%_GA}"
              export PKG_RELEASE="1_develop_snapshot"
              BUILDINFO_REVISION="1_develop_snapshot"
              cd ../zm-mailbox
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NUMBER}_${CIRCLE_BUILD_NUM}" clean publish-local-all
              cd ../zm-timezones
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NUMBER}_${CIRCLE_BUILD_NUM}" -Dzimbra.buildinfo.revision="${BUILDINFO_REVISION}" clean pkg
              cd ../zm-taglib
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NUMBER}_${CIRCLE_BUILD_NUM}" clean publish-local
              cd ../zm-ajax
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NUMBER}_${CIRCLE_BUILD_NUM}" clean publish-local
              cd ../zm-web-client
              ant -Dzimbra.buildinfo.version="${BUILD_RELEASE_NUMBER}_${CIRCLE_BUILD_NUM}" -Dzimbra.buildinfo.revision="${BUILDINFO_REVISION}" -Dwclient.ext.patch.version="${BUILD_RELEASE_NUMBER}" -Dwclient.ext.patch.revision="${PKG_RELEASE}" clean pkg
              JOB_OUT_DIR="build/dist/${CIRCLE_JOB}"
              mkdir -p "$JOB_OUT_DIR"
              find build/dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) -exec mv -f {} "$JOB_OUT_DIR"/ \;
              rm -rf build/dist/jetty
         - store_artifacts:
            path: build/dist
         - persist_to_workspace:
            root: ..
            paths: zm-web-client/build/dist/*

   publish_job_steps: &publish_job_steps
      steps:
         - attach_workspace:
            at: ..
         - run:
            name: Publish package artifacts to Nexus
            command: |
              mkdir -p /home/build/.ivy2/cache
              sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl
              : "${NEXUS_HOST:?NEXUS_HOST is required}"
              : "${NEXUS_USER:?NEXUS_USER is required}"
              : "${NEXUS_PASSWORD:?NEXUS_PASSWORD is required}"
              ROOT="build/dist"
              APT_REPO="package-repo-apt"
              YUM_REPO="package-repo-yum"
              MODULE_PATH="zimbra"
              RAW_BASE="$(printf '%s' "${NEXUS_BASE_URL:-$NEXUS_HOST}" | sed 's/#.*$//' | sed 's:/$::')"
              API_BASE="$RAW_BASE/service/rest/v1/components"
              PACKAGE_FILES="$(find "$ROOT" -type f \( -name '*.deb' -o -name '*.rpm' \))"
              if [ -z "$PACKAGE_FILES" ]; then
                exit 1
              fi
              package_list_file="$(mktemp)"
              printf '%s\n' "$PACKAGE_FILES" > "$package_list_file"
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                rel="$(printf '%s\n' "$f" | sed "s|^$ROOT/||")"
                dir="$(dirname "$rel")"
                file_name="$(basename "$f")"
                body_file="$(mktemp)"
                header_file="$(mktemp)"
                case "$f" in
                  *.deb)
                    repo="$APT_REPO"
                    url="$API_BASE?repository=$repo"
                    http_code="$(curl --silent --show-error --user "$NEXUS_USER:$NEXUS_PASSWORD" --request POST "$url" -F "apt.asset=@$f" --dump-header "$header_file" --output "$body_file" --write-out '%{http_code}' || true)"
                    ;;
                  *.rpm)
                    repo="$YUM_REPO"
                    yum_dir="$MODULE_PATH/$dir"
                    url="$API_BASE?repository=$repo"
                    http_code="$(curl --silent --show-error --user "$NEXUS_USER:$NEXUS_PASSWORD" --request POST "$url" -F "yum.directory=$yum_dir" -F "yum.asset=@$f" -F "yum.asset.filename=$file_name" --dump-header "$header_file" --output "$body_file" --write-out '%{http_code}' || true)"
                    ;;
                  *)
                    rm -f "$body_file" "$header_file"
                    continue
                    ;;
                esac
                case "$http_code" in
                  2??)
                    ;;
                  *)
                    [ -s "$header_file" ] && sed -n '1,80p' "$header_file"
                    [ -s "$body_file" ] && sed -n '1,120p' "$body_file"
                    rm -f "$body_file" "$header_file"
                    exit 1
                    ;;
                esac
                rm -f "$body_file" "$header_file"
              done < "$package_list_file"
              rm -f "$package_list_file"

############################################################################

jobs:
   checkout:
      working_directory: ~/zm-web-client
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: small
      <<: *checkout_job_steps

   build_u24:
      working_directory: ~/zm-web-client
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-24.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: medium
      <<: *build_job_steps_ubuntu

   build_u22:
      working_directory: ~/zm-web-client
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: medium
      <<: *build_job_steps_ubuntu

   build_u20:
      working_directory: ~/zm-web-client
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-20.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: medium
      <<: *build_job_steps_ubuntu

   build_u18:
      working_directory: ~/zm-web-client
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-18.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: medium
      <<: *build_job_steps_ubuntu

   build_c9:
      working_directory: ~/zm-web-client
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-9
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: medium
      <<: *build_job_steps_centos

   build_c8:
      working_directory: ~/zm-web-client
      shell: /bin/bash -eo pipefail
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-centos-8
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: medium
      <<: *build_job_steps_centos

   publish:
      working_directory: ~/zm-web-client
      shell: /bin/bash -eo pipefail
      circleci_ip_ranges: true
      docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
      resource_class: small
      <<: *publish_job_steps

############################################################################

workflows:
   version: 2
   main:
      jobs:
         - checkout:
            context:
               - docker-dev-registry
               - build-number
            filters:
               branches:
                  only:
                    - develop-snapshot
                    - publish-nexus-package-poc
         - build_u24:
            context:
               - docker-dev-registry
               - build-number
            requires:
               - checkout
            filters:
               branches:
                  only:
                    - develop-snapshot
                    - publish-nexus-package-poc
         - build_u22:
            context:
               - docker-dev-registry
               - build-number
            requires:
               - checkout
            filters:
               branches:
                  only:
                    - develop-snapshot
                    - publish-nexus-package-poc
         - build_u20:
            context:
               - docker-dev-registry
               - build-number
            requires:
               - checkout
            filters:
               branches:
                  only:
                    - develop-snapshot
                    - publish-nexus-package-poc
         - build_u18:
            context:
               - docker-dev-registry
               - build-number
            requires:
               - checkout
            filters:
               branches:
                  only:
                    - develop-snapshot
                    - publish-nexus-package-poc
         - build_c9:
            context:
               - docker-dev-registry
               - build-number
            requires:
               - checkout
            filters:
               branches:
                  only:
                    - develop-snapshot
                    - publish-nexus-package-poc
         - build_c8:
            context:
               - docker-dev-registry
               - build-number
            requires:
               - checkout
            filters:
               branches:
                  only:
                    - develop-snapshot
                    - publish-nexus-package-poc
         - publish:
            context:
               - docker-dev-registry
